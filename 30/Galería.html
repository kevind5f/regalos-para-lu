<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galería</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF6F1; --ink:#3A2E39; --vine:#8FA382; --petal:#D9A6AE;
    --center:#E7B84B; --card:#FFFDF9; --card-border:#E4D9CC; --back:#F1E7DD;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#221E23; --ink:#F1E8E2; --vine:#6E8863; --petal:#C08A93;
      --center:#D9A93F; --card:#2C262B; --card-border:#443B41; --back:#352E33;
    }
  }
  :root[data-theme="dark"]{
    --bg:#221E23; --ink:#F1E8E2; --vine:#6E8863; --petal:#C08A93;
    --center:#D9A93F; --card:#2C262B; --card-border:#443B41; --back:#352E33;
  }
  *{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
  }
  header{
    max-width:520px; margin:0 auto; padding:4rem 1.5rem 2.5rem; text-align:center;
  }
  header h1{
    font-family:'Cormorant Garamond',serif; font-weight:600;
    font-size:clamp(2rem,7vw,2.8rem); margin:0 0 .5rem;
  }
  header p{ margin:0; opacity:.75; font-size:.95rem; line-height:1.5; }

  .timeline{ position:relative; max-width:520px; margin:0 auto; padding:1rem 1rem 5rem; }
  .timeline::before{
    content:''; position:absolute; left:50%; top:0; bottom:0; width:2px;
    background:linear-gradient(var(--vine), var(--vine) 70%, transparent);
    transform:translateX(-50%);
  }
  .entry{
    position:relative; display:flex; align-items:center; justify-content:center;
    gap:.9rem; margin:2.4rem 0;
  }
  .entry:nth-child(even){ flex-direction:row-reverse; }

  .flower{ width:44px; height:55.4px; flex:none; position:relative; z-index:1; }
  .flower svg{ width:100%; height:100%; display:block; }
  .flower.sticker-slot{
    box-sizing:border-box; border:1.5px dashed var(--card-border); border-radius:6px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:.52rem; line-height:1.15; opacity:.6; padding:.2rem;
    font-family:'Cormorant Garamond',serif; font-style:italic; white-space:pre-line;
  }

  .photo-card{
    width:150px; aspect-ratio:4/5; perspective:800px; cursor:pointer; flex:none;
  }
  .photo-inner{
    position:relative; width:100%; height:100%; transition:transform .6s;
    transform-style:preserve-3d;
  }
  .photo-card.flipped .photo-inner{ transform:rotateY(180deg); }
  .face{
    position:absolute; inset:0; backface-visibility:hidden;
    border-radius:6px; border:1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
    padding:.8rem; text-align:center;
  }
  .front{
    background:var(--card);
    font-size:.8rem; flex-direction:column; gap:.4rem;
  }
  .front span.n{ font-family:'Cormorant Garamond',serif; font-size:1.6rem; opacity:.8; }
  .front{ overflow:hidden; }
  .front img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .flower img{ width:100%; height:100%; object-fit:contain; display:block; }
  .back{
    background:var(--back); transform:rotateY(180deg);
    font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1rem;
    line-height:1.4;
  }
  .photo-card:focus-visible{ outline:2px solid var(--center); outline-offset:3px; }

  footer{ text-align:center; padding-bottom:3rem; opacity:.5; font-size:.8rem; }

  @media (prefers-reduced-motion: reduce){
    .photo-inner{ transition:none; }
  }
</style>
</head>

<footer>Tengo mas fotos de Mushu que de nosotros
  <br> Con Mucho Amor Mi Loca 💘
</footer>

<script>
const TOTAL = 10;
const flowerTplSvg = document.getElementById('flowerTpl').content.querySelector('svg');

// FOTOS (una por tarjeta, 10 espacios). Pon la ruta o dato de cada foto entre comillas.
// Ejemplo: "fotos/foto1.jpg". Si queda vacío ("") se muestra el placeholder.
const photos = ["img/1.jpg","img/2.jpg","img/3.jpg","img/4.jpg","img/5.jpg","img/6.jpg","img/7.jpg","img/8.jpg","img/9.jpg","img/10.jpg"];




// IMÁGENES (Snoopy, Snorlax, gatos…; 9 espacios, van junto a las tarjetas 2 a 10).
// Ejemplo: "imagenes/snoopy.png". Vacío ("") = placeholder.
const images = ["img/11.jpg","img/12.jpg","img/13.jpg","img/14.jpg","img/15.jpg","img/16.jpg","img/17.jpg","img/18.jpg","img/19.jpg"];

const phrases = [
  "Eres mi lugar favorito, esté donde esté.",
  "Contigo hasta un día cualquiera se siente especial.",
  "Hay días que solo necesitan tu risa para ser buenos.",
  "Mi parte favorita de cualquier plan eres tú.",
  "Contigo aprendí que la calma también tiene una cara bonita.",
  "No necesito un plan si voy contigo.",
  "Cada día contigo es una página que quiero releer.",
  "Gracias por escucharme aunque no tuviera sentido lo que decía.",
  "Gracias por quedarte incluso en los días que no eran fáciles de querer.",
  "Contigo aprendí que querer también es cuidar los detalles."
];
const photoWords = [
  "espacio libre","falta esta"
];
const imageWords = [
  "otra imagen aquí"
];

const tl = document.getElementById('timeline');
for(let i=1;i<=TOTAL;i++){
  const entry = document.createElement('div');
  entry.className = 'entry';
  entry.innerHTML = `
    <div class="flower"></div>
    <div class="photo-card" tabindex="0" role="button" aria-label="Foto ${i}, toca para voltear">
      <div class="photo-inner">
        <div class="face front">${photos[i-1] ? `<img src="${photos[i-1]}" alt="Foto ${i}">` : `<span class="n">${i}</span>foto ${photoWords[i-1]}`}</div>
        <div class="face back">${phrases[i-1]}</div>
      </div>
    </div>`;
  const spacer = entry.querySelector('.flower');
  if(i === 1){
    spacer.appendChild(flowerTplSvg.cloneNode(true));
  } else if(images[i-2]){
    spacer.innerHTML = `<img src="${images[i-2]}" alt="">`;
  } else {
    spacer.classList.add('sticker-slot');
    spacer.textContent = imageWords[i-2];
  }
  const card = entry.querySelector('.photo-card');
  const flip = () => card.classList.toggle('flipped');
  card.addEventListener('click', flip);
  card.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(); }});
  tl.appendChild(entry);
}
</script>
