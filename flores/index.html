<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un regalo para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2213%22>🌼</text></svg>">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(rgba(20,14,10,0.35), rgba(20,14,10,0.55)),
                url('img/amar.png') center/cover no-repeat;
    font-family: 'Cormorant Garamond', Georgia, serif;
    padding: 2rem 1.25rem;
    padding-top: max(2rem, env(safe-area-inset-top));
    padding-bottom: max(2rem, env(safe-area-inset-bottom));
  }
  .card {
    text-align: center;
    max-width: 380px;
  }
  h1 {
    margin: 0;
    font-family: 'Dancing Script', cursive;
    font-weight: 600;
    font-size: clamp(2.2rem, 8vw, 3.2rem);
    color: #fff;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  p {
    margin: 0.6rem 0 2rem;
    font-size: clamp(1rem, 3vw, 1.15rem);
    color: rgba(255,255,255,0.85);
    font-style: italic;
  }
  a.boton {
    display: inline-block;
    padding: 14px 38px;
    border-radius: 999px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.4);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #fff;
    text-decoration: none;
    font-size: 1rem;
    letter-spacing: 0.5px;
    transition: all 0.3s ease;
  }
  a.boton:hover {
    background: rgba(255,255,255,0.22);
    transform: translateY(-2px);
  }
  .volver-raiz {
    position: fixed;
    top: max(1rem, env(safe-area-inset-top));
    left: 1rem;
    font-family: sans-serif;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.6);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
  }
  .volver-raiz:hover { color: #fff; }
</style>
</head>
<body>
  <a href="../" class="volver-raiz">← atrás</a>
  <div class="card">
    <h1>Mi amor</h1>
    <p>Tengo algo pequeño para ti</p>
    <a href="rosas.html" class="boton">Ver regalo</a>
  </div>
</body>
</html>
