  .mensaje-fijo {
    position: fixed;

    left: 50%;

    text-align: center;
    pointer-events: none;
  }
  .mensaje-fijo__linea {
    display: block;

  }
  .mensaje-fijo p {
    margin: 0;
    font-family: 'Dancing Script', cursive;
    font-weight: 600;
    font-size: clamp(1.3rem, 4vw, 1.7rem);
    color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    letter-spacing: 0.3px;
  }
  .volver-raiz {
    position: fixed;
    top: max(1rem, env(safe-area-inset-top));
    left: 1rem;
    z-index: 500;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.5);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
  }
  .volver-raiz:hover { color: #fff; }
</style>
